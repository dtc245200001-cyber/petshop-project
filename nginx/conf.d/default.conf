# ---- Khai báo dùng chung (ngữ cảnh http) ----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

# ---- HTTP :80 -> chuyển hướng sang HTTPS ----
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS :443 ----
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    # DNS nội bộ của Docker: cho phép khởi động Nginx dù một dịch vụ chưa chạy
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers cơ bản
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tránh trùng header khi dịch vụ phía sau cũng tự gửi
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;

    client_max_body_size 5m;
    limit_req zone=perip burst=40 nodelay;      # chống flood

    # Không cho Internet đọc /metrics của app (Prometheus scrape trực tiếp trong mạng nội bộ)
    location = /metrics { return 404; }

    # ---- pgAdmin tại /pgadmin/ ----
    location = /pgadmin { return 301 /pgadmin/; }
    location /pgadmin/ {
        set $pgadmin http://pgadmin:8080;
        rewrite ^/pgadmin/(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
        proxy_pass $pgadmin;
    }

    # ---- Grafana tại /grafana/ ----
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        set $grafana http://grafana:3000;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass $grafana;
    }

    # ---- Ứng dụng PetShop tại / ----
    location / {
        set $petshop http://app:5000;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass $petshop;
    }
}

# ---- stub_status chỉ cho nginx-exporter (không publish port ra ngoài) ----
server {
    listen 8081;
    server_name _;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    location /stub_status {
        stub_status;
        access_log off;
    }
}
