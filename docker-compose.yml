name: petshop

# Cấu hình bảo mật dùng chung: bỏ mọi Linux capability, cấm leo thang đặc quyền
x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  # ===================== DATABASE =====================
  db:
    <<: *security
    mem_limit: 512m
    image: postgres:16-alpine
    container_name: petshop-db
    # Postgres cần vài capability để khởi tạo thư mục dữ liệu rồi hạ quyền xuống user postgres
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ===================== WEB APP =====================
  app:
    <<: *security
    mem_limit: 512m
    build: ./app
    image: petshop-app:1.0
    container_name: petshop-app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: petshop_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:5000:5000"   # chỉ để debug trong VM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend
      - monitoring

  # ===================== PGADMIN (công cụ quản lý DB) =====================
  # Lưu ý: pgAdmin KHÔNG dùng cap_drop: ALL (dễ lỗi loop đăng nhập),
  # chỉ giữ no-new-privileges để vừa an toàn vừa chạy ổn định.
  pgadmin:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    image: dpage/pgadmin4:8
    container_name: petshop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: "8080"
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:8080"   # chỉ để debug trong VM
    networks:
      - frontend
      - backend

  # ===== [NGINX] =====
  nginx:
    <<: *security
    image: nginxinc/nginx-unprivileged:1.27-alpine   # chạy non-root (UID 101)
    container_name: petshop-nginx
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - app
    networks:
      - frontend
      - monitoring
  # ===== [MONITORING] =====
  prometheus:
    <<: *security
    mem_limit: 512m
    image: prom/prometheus:v2.54.1
    container_name: petshop-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # chỉ truy cập qua SSH tunnel
    networks:
      - monitoring

  grafana:
    <<: *security
    mem_limit: 512m
    image: grafana/grafana:11.2.0
    container_name: petshop-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://${VM_IP}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - frontend
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: petshop-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  nginx-exporter:
    <<: *security
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: petshop-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring

  postgres-exporter:
    <<: *security
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: petshop-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://exporter:${EXPORTER_DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - monitoring
  # ===== [LOGGING] =====

networks:
  frontend:
  backend:
    internal: true     # mạng nội bộ: không ra Internet, không publish port
  monitoring:

volumes:
  db_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
