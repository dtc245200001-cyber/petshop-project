<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetShop Manager</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
    header{background:#2f6f5e;padding:14px 24px}
    header a{color:#fff;margin-right:18px;text-decoration:none;font-weight:600}
    header a:hover{text-decoration:underline}
    main{max-width:1000px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .stats{display:flex;gap:16px;flex-wrap:wrap}
    .stat{flex:1;min-width:160px;background:#fff;border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .stat b{display:block;font-size:32px;color:#2f6f5e}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
    th,td{padding:10px 12px;border-bottom:1px solid #e5e8eb;text-align:left}
    th{background:#e9f2ef}
    form.inline{display:inline}
    label{display:inline-block;margin:4px 12px 8px 0;font-size:14px}
    input,select{padding:6px 8px;border:1px solid #bbb;border-radius:4px;display:block;margin-top:4px}
    button{background:#2f6f5e;color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer}
    button.danger{background:#b3402f;padding:4px 10px}
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">PetShop</a>
    <a href="{{ url_for('entity_page', entity='customers') }}">Khách hàng</a>
    <a href="{{ url_for('entity_page', entity='pets') }}">Thú cưng</a>
    <a href="{{ url_for('entity_page', entity='services') }}">Dịch vụ spa</a>
    <a href="{{ url_for('entity_page', entity='appointments') }}">Lịch hẹn</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
