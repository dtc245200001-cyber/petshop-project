{% extends "base.html" %}
{% from "_macros.html" import icon, csrf with context %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Đổi mật khẩu</h1><p class="page-head__desc">Sau khi đổi, bạn sẽ được đăng xuất khỏi mọi thiết bị và cần đăng nhập lại.</p></div>
</div>
<div class="card stack card--narrow">
  <form method="post" action="{{ url_for('change_password') }}" class="stack">
    {{ csrf() }}
    <div class="field">
      <label class="field__label" for="current">Mật khẩu hiện tại</label>
      <div class="input-wrap">
        <input class="input" id="current" name="current" type="password" autocomplete="current-password" required autofocus>
        <button class="input-wrap__btn" type="button" data-toggle-password="current" aria-label="Hiện mật khẩu" aria-pressed="false">{{ icon('eye') }}</button>
      </div>
    </div>
    <div class="field">
      <label class="field__label" for="new">Mật khẩu mới</label>
      <div class="input-wrap">
        <input class="input" id="new" name="new" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button class="input-wrap__btn" type="button" data-toggle-password="new" aria-label="Hiện mật khẩu" aria-pressed="false">{{ icon('eye') }}</button>
      </div>
      <div class="meter" data-meter-for="new" data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <span class="field__hint">Tối thiểu 8 ký tự. Độ mạnh: <b data-meter-label></b></span>
    </div>
    <div class="field">
      <label class="field__label" for="confirm">Nhập lại mật khẩu mới</label>
      <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    </div>
    <div class="form-actions mt-0">
      <button class="btn" type="submit"><span class="btn__label">Cập nhật mật khẩu</span></button>
      <a class="btn btn--secondary" href="{{ url_for(home_url) }}">Hủy</a>
    </div>
  </form>
</div>
{% endblock %}
