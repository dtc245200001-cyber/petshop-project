{% extends "base.html" %}
{% block title %}Đăng nhập - PetShop{% endblock %}
{% block content %}
<div class="card auth">
  <h2>Đăng nhập</h2>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email (tên đăng nhập)
      <input type="email" name="email" required autofocus maxlength="100">
    </label>
    <label>Mật khẩu
      <input type="password" name="password" required>
    </label>
    <button type="submit">Đăng nhập</button>
  </form>
  <p class="muted">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
</div>
{% endblock %}
