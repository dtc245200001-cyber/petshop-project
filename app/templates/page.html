{% extends "base.html" %}
{% block content %}
<h2>{{ cfg.title }}</h2>

<form method="post" class="card">
  {% for f in fields %}
  <label>{{ f.label }}
    {% if f.type == 'select' %}
      <select name="{{ f.name }}" required>
        {% for o in f.options %}<option value="{{ o.id }}">{{ o.label }}</option>{% endfor %}
      </select>
    {% else %}
      <input type="{{ f.type }}" name="{{ f.name }}" {% if f.required %}required{% endif %} {% if f.type == 'number' %}step="any" min="0"{% endif %}>
    {% endif %}
  </label>
  {% endfor %}
  <button type="submit">Thêm mới</button>
</form>

<table>
  <tr>{% for c in cfg.columns %}<th>{{ c[1] }}</th>{% endfor %}<th></th></tr>
  {% for r in rows %}
  <tr>
    {% for c in cfg.columns %}<td>{{ r[c[0]] }}</td>{% endfor %}
    <td>
      <form class="inline" method="post" action="{{ url_for('delete_item', entity=entity, item_id=r['id']) }}">
        <button class="danger" type="submit">Xóa</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="{{ cfg.columns|length + 1 }}">Chưa có dữ liệu.</td></tr>
  {% endfor %}
</table>
{% endblock %}
